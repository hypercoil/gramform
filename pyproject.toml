[build-system]
requires = ["setuptools >=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gramform"
version = "0.0.0.dev0"
description = "Grammar for string-to-function formulae"
authors = [
  { name = "Rastko Ciric", email = "rastko@stanford.edu" },
]
maintainers = [
  { name = "Rastko Ciric", email = "rastko@stanford.edu" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
]
requires-python = ">=3.12"
dependencies = [
    "ply",
    "wadler-lindig",
    "pydantic",
]

[project.optional-dependencies]
# The Wilkinson grammar's interpreter emits ``formulaic`` objects.
wilkinson = [
    "formulaic",
]
# The ``grammars/dataframe`` materialising interpreter operates via narwhals.
dataframe = [
    "narwhals",
    "numpy",
]
dev = [
    "pytest",
    "pytest-cov",
    "coverage[toml]",
    "ruff",
    "pyright",
    "formulaic",
    "narwhals",
    "numpy",
    "pandas",
]

[project.urls]
"Homepage" = "https://github.com/hypercoil/gramform"

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 2

[tool.coverage.run]
branch = true
omit = [
    '*test*',
    '*__init__*',
]

[tool.ruff]
lint.ignore = []
line-length = 79
lint.select = [
    "E",
    "F",
    "W",
    "I001",
]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pyright]
# Scoped to the nwx IR/contract -- the typed surface we gate on. The core
# PLY/pydantic engine is dynamic by design (runtime-built lexer/parser), so it
# is exercised by the test suite rather than statically type-checked here.
include = ["src/gramform/grammars/nwx"]
typeCheckingMode = "basic"
